memory:
  root: ~/.pi/agent/pi-friend/memory
  tool_prefix: memory_

  vector:
    chunk_size: 4000

  injection:
    enabled: true
    position: -1
    mode: hybrid
    limit: 5
    max_chars: 6000

  auto_capture:
    enabled: true
    every_turns: 5
    max_candidates: 3
    # model: openrouter/google/gemini-2.5-flash

  sweep:
    enabled: true
    background: false
    tombstone_grace_days: 30
    min_guarded_batch_size: 10
    # model: openrouter/google/gemini-2.5-flash

  dreaming:
    enabled: true
    max_nodes: 4
    # model: openrouter/google/gemini-2.5-flash
