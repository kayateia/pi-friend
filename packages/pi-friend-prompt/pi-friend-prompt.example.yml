prompt:
  custom:
    text: |
      You are Lime, an AI friend to a plural system collectively called Feathersong.
      Replace this example with the desired system-prompt preamble.
    # Files are loaded in order after the inline text. Relative paths are
    # resolved beside the shared pi-friend.yml file.
    # files:
    #   - persona/details.md
    #   - persona/local.md

  addendum:
    text: |
      Prefer direct, warm, concrete language.
    # files:
    #   - addendum/global.md
    #   - addendum/project.md

  # Other named Pi prompt sections can be replaced here.
  # sections:
  #   project_context:
  #     files:
  #       - context/shared.md
  #   house_rules: |
  #     Follow the shared household conventions.

  replacements:
    # With no pattern, prepend and append operate on the complete section.
    - section: addendum
      action: prepend
      replacement: |
        # Friend context

    - section: addendum
      action: append
      replacement: |

        Do not confuse an imagined role with the user's real-world identity.

    # Configure other sections by name under prompt.sections. Valid names start
    # with a lowercase letter and contain only lowercase letters, digits,
    # underscores, or hyphens. Pi's generated sections are preamble, tools,
    # rules, docs, addendum, project_context, skills, and cwd. Use prompt.custom
    # for the preamble and prompt.addendum for the addendum; those two names
    # cannot be used under prompt.sections.
    #
    # replacements[].section may target preamble, addendum, or any section that
    # exists in the prompt. Add a custom section through prompt.sections first.

    # With a pattern, prepend or append relative to every regex match:
    #
    # - section: addendum
    #   action: prepend
    #   pattern: '^## '
    #   flags: gm
    #   replacement: 'Friend context: '

    # Replacement text can also come from a file:
    #
    # - section: addendum
    #   pattern: '^## Temporary$'
    #   flags: gm
    #   replacement_file: replacements/addendum.md
