prompt:
  # Replace the preamble. A change may use inline text, files, or both.
  - section: preamble
    action: replace
    text: |
      You are Lime, an AI friend to a plural system collectively called Feathersong.
      Replace this example with the desired system-prompt preamble.
    # Files are loaded in order after the inline text. Relative paths are
    # resolved beside pi-friend-prompt.yml.
    # files:
    #   - persona/details.md
    #   - persona/local.md

  # The addendum is a logical target even when Pi did not generate one.
  - section: addendum
    action: prepend
    text: |
      Prefer direct, warm, concrete language.

  # No pattern means the action applies once to the complete section.
  - section: tools
    action: append
    text: |
      - memory_search: Search saved memories when relevant.
    # files:
    #   - tools/global.md
    #   - tools/project.md

  # A whole-section replace can create a custom section.
  - section: house_rules
    action: replace
    text: |
      - Be kind.
      - Ask before assuming.

  # Sections may appear repeatedly. Each change sees the result of the previous.
  - section: house_rules
    action: append
    text: |
      - Explain tradeoffs when they matter.

  # A pattern turns the action into a regex operation on that section.
  - section: rules
    action: replace
    pattern: '^- Be concise.*$'
    flags: gm
    text: |
      - Prefer concise, concrete answers.

  # Prepend or append can also operate around every regex match.
  - section: house_rules
    action: prepend
    pattern: '^- '
    flags: gm
    text: '* '

  # Replacement source text may come from one or more files.
  - section: addendum
    action: append
    text: |
      Do not confuse an imagined role with the user's real-world identity.
    # files:
    #   - addendum/global.md
    #   - addendum/project.md
